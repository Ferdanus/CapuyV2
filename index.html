<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Surat Spesial Untuk Bubuy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floating Sparkles & Heart Canvas -->
  <canvas id="loveCanvas"></canvas>
  
  <!-- Love & Cute Cat Emoji Overlay -->
  <div id="emojiOverlay" class="emoji-overlay"></div>

  <!-- Soft Pink Glow Flash -->
  <div id="flashEffect" class="flash-effect"></div>

  <main class="main-wrapper" id="mainWrapper">
    
    <!-- Cute Sweet Intro Header -->
    <div class="intro-header" id="introHeader">
      <div class="cute-tag">Spesial Untuk Kamu</div>
      <h1 class="cute-title">Surat Buat Bubuy</h1>
      <p class="cute-desc">Ada pesan kecil buat kamu, coba buka pelan-pelan ya...</p>
    </div>

    <!-- Cute Envelope Container -->
    <div class="envelope-box" id="envelopeBox">
      <div class="envelope" id="envelope">
        
        <!-- Flap Top fold -->
        <div class="flap-top" id="flapTop"></div>
        
        <!-- Photo & Sweet Letter Card inside -->
        <div class="letter-card" id="letterCard">
          <div class="photo-wrapper">
            <img src="bubuy.jpg" alt="Foto Bubuy" id="lovePhoto" class="love-image">
            <div class="love-aura"></div>
            
            <!-- Cute Stalking Cat Feature (Kucing Stalking dari atas) -->
            <div class="stalking-cat-container" id="stalkingCatContainer">
              <div class="stalker-cat">
                <div class="stalker-ears">
                  <div class="stalker-ear stalker-ear-l"></div>
                  <div class="stalker-ear stalker-ear-r"></div>
                </div>
                <div class="stalker-head">
                  <div class="stalker-eye-socket eye-l">
                    <div class="stalker-pupil"></div>
                    <div class="stalker-glint"></div>
                  </div>
                  <div class="stalker-eye-socket eye-r">
                    <div class="stalker-pupil"></div>
                    <div class="stalker-glint"></div>
                  </div>
                  <div class="stalker-nose"></div>
                  <div class="stalker-blush stalker-blush-l"></div>
                  <div class="stalker-blush stalker-blush-r"></div>
                </div>
                <div class="stalker-paws">
                  <div class="stalker-paw paw-l"></div>
                  <div class="stalker-paw paw-r"></div>
                </div>
                <div class="stalker-sparkle"></div>
              </div>
            </div>

            <!-- Cute Cat Petting Feature -->
            <div class="petting-cat-container" id="pettingCatContainer">
              <div class="peeking-cat">
                <div class="cat-ear ear-left"></div>
                <div class="cat-ear ear-right"></div>
                <div class="cat-face">
                  <div class="cat-eye eye-left"></div>
                  <div class="cat-eye eye-right"></div>
                  <div class="cat-blush blush-left"></div>
                  <div class="cat-blush blush-right"></div>
                  <div class="cat-nose"></div>
                  <div class="cat-mouth"></div>
                </div>
              </div>
              
              <div class="cat-paw-arm">
                <div class="cat-paw-hand">
                  <div class="paw-bean main-bean"></div>
                  <div class="paw-bean toe-1"></div>
                  <div class="paw-bean toe-2"></div>
                  <div class="paw-bean toe-3"></div>
                </div>
              </div>

              <div class="pet-heart-puff"></div>
            </div>
          </div>
          
          <div class="sweet-text-area" id="sweetTextArea">
            <h2 class="sweet-heading">Cantik Banget Sih!</h2>
            <p class="sweet-sub">Semangat terus ya, jangan lupa senyum hari ini!</p>
          </div>
        </div>

        <!-- Envelope Body Structure -->
        <div class="envelope-back"></div>
        <div class="envelope-left"></div>
        <div class="envelope-right"></div>
        <div class="envelope-front"></div>

        <!-- Heart Wax Seal Button -->
        <div class="seal-button" id="sealButton">
          <span class="seal-label">BUKA</span>
        </div>
      </div>

      <!-- Cute bouncing tap prompt -->
      <div class="tap-prompt" id="tapPrompt">
        <span>Ketuk suratnya</span>
      </div>
    </div>

    <!-- Replay Button -->
    <div class="replay-zone" id="replayZone">
      <button class="btn-reset" id="btnReset">
        Buka Lagi
      </button>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
