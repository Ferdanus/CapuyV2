<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Info Penting Banget!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Particle / Fire Canvas -->
  <canvas id="fireCanvas"></canvas>
  
  <!-- Goofy emoji overlay -->
  <div id="emojiOverlay" class="emoji-overlay"></div>

  <!-- Screen Flash -->
  <div id="flashEffect" class="flash-effect"></div>

  <main class="main-wrapper" id="mainWrapper">
    
    <!-- Cute Intro Header (No emojis in text) -->
    <div class="intro-header" id="introHeader">
      <div class="cute-tag">INFO PENTING</div>
      <h1 class="cute-title">Coba Bubuy Buka Ini</h1>
      <p class="cute-desc">Ada info penting banget...</p>
    </div>

    <!-- Cute Envelope Container -->
    <div class="envelope-box" id="envelopeBox">
      <div class="envelope" id="envelope">
        
        <!-- Flap Top fold -->
        <div class="flap-top" id="flapTop"></div>
        
        <!-- Photo & Teasing Card inside -->
        <div class="letter-card" id="letterCard">
          <div class="photo-wrapper">
            <img src="photo.png" alt="Foto" id="prankPhoto" class="prank-image">
            <div class="fire-aura"></div>
          </div>
          
          <div class="mock-text-area" id="mockTextArea">
            <h2 class="mock-heading">>:)</h2>
          </div>
        </div>

        <!-- Envelope Body Structure -->
        <div class="envelope-back"></div>
        <div class="envelope-left"></div>
        <div class="envelope-right"></div>
        <div class="envelope-front"></div>

        <!-- Cute Heart/Round Seal Button -->
        <div class="seal-button" id="sealButton">
          <span class="seal-label">BUKA</span>
        </div>
      </div>

      <!-- Cute bouncing tap prompt -->
      <div class="tap-prompt" id="tapPrompt">
        <span>Ketuk suratnya</span>
      </div>
    </div>

    <!-- Replay Button -->
    <div class="replay-zone" id="replayZone">
      <button class="btn-reset" id="btnReset">
        Coba Lagi
      </button>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
